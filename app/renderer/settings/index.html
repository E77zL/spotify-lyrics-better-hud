<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>设置 · Spotify 悬浮歌词</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="settings">
    <h1>设置</h1>

    <section>
      <label class="row">
        <span>背景颜色</span>
        <input type="color" id="bgColor" value="#121214" />
      </label>
      <div class="presets" id="presets">
        <button class="swatch" data-color="#121214" style="background:#121214" title="深灰"></button>
        <button class="swatch" data-color="#000000" style="background:#000000" title="纯黑"></button>
        <button class="swatch" data-color="#1d2b1f" style="background:#1d2b1f" title="墨绿"></button>
        <button class="swatch" data-color="#1a1f33" style="background:#1a1f33" title="深蓝"></button>
        <button class="swatch" data-color="#2b1a1f" style="background:#2b1a1f" title="酒红"></button>
        <button class="swatch" data-color="#2b271a" style="background:#2b271a" title="暖棕"></button>
      </div>
    </section>

    <section>
      <label class="row">
        <span>歌词文字颜色</span>
        <input type="color" id="lyricColor" value="#f5f5f0" />
      </label>
      <p class="hint">设置歌词本身的颜色，当前播放的那一句会保持满色高亮。</p>
    </section>

    <section>
      <label class="row">
        <span>窗口透明度 <em id="transparencyVal">55%</em></span>
        <input type="range" id="transparency" min="10" max="100" step="5" value="55" />
      </label>
    </section>

    <div class="actions">
      <button class="btn primary" id="doneBtn">完成</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
