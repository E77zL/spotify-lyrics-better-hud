name: Build Windows 1.2
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify
        shell: powershell
        run: .\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify-Lyrics-HUD-v1.2
          path: dist/*
          if-no-files-found: error
